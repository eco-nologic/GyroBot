<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiRobot Control Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 GiRobot Control Dashboard</h1>
            <div class="status-bar">
                <span class="status-item">
                    <span class="label">Status:</span>
                    <span id="connectionStatus" class="status-value disconnected">Disconnected</span>
                </span>
                <span class="status-item">
                    <span class="label">Battery:</span>
                    <span id="batteryStatus" class="status-value">--V</span>
                </span>
            </div>
        </header>

        <main>
            <div class="grid">
                <!-- Robot Visualization -->
                <section class="card">
                    <h2>Robot Position</h2>
                    <canvas id="robotCanvas" width="400" height="400"></canvas>
                    <div class="coords">
                        <p>X: <span id="posX">0.0</span> mm</p>
                        <p>Y: <span id="posY">0.0</span> mm</p>
                        <p>Θ: <span id="posTheta">0.0</span> rad</p>
                    </div>
                </section>

                <!-- Controls -->
                <section class="card">
                    <h2>Manual Control</h2>
                    <div class="joystick-area">
                        <div id="joystick" class="joystick">
                            <div id="joystickHandle" class="joystick-handle"></div>
                        </div>
                    </div>

                    <div class="button-grid">
                        <button id="btnStop" class="btn btn-danger">🛑 STOP</button>
                        <button id="btnForward" class="btn btn-primary">⬆️ Forward</button>
                        <button id="btnBackward" class="btn btn-primary">⬇️ Backward</button>
                        <button id="btnTurnLeft" class="btn btn-primary">⬅️ Left</button>
                        <button id="btnTurnRight" class="btn btn-primary">➡️ Right</button>
                    </div>
                </section>

                <!-- Drawing Commands -->
                <section class="card">
                    <h2>Draw Shapes</h2>
                    <div class="draw-buttons">
                        <button id="btnCircle" class="btn btn-secondary">⭕ Circle</button>
                        <button id="btnTriangle" class="btn btn-secondary">▲ Triangle</button>
                        <button id="btnRectangle" class="btn btn-secondary">▭ Rectangle</button>
                    </div>

                    <div class="input-group">
                        <label>Text to Draw:</label>
                        <input id="textInput" type="text" placeholder="Enter text...">
                        <button id="btnDrawText" class="btn btn-secondary">📝 Draw Text</button>
                    </div>
                </section>

                <!-- Motor Status -->
                <section class="card">
                    <h2>Motor Status</h2>
                    <div class="motor-status">
                        <div class="motor-info">
                            <h3>Left Motor</h3>
                            <p>Speed: <span id="leftSpeed">0</span> mm/s</p>
                            <p>Encoder: <span id="leftEncoder">0</span> steps</p>
                            <div id="leftHealthBar" class="health-bar ok">✅</div>
                        </div>
                        <div class="motor-info">
                            <h3>Right Motor</h3>
                            <p>Speed: <span id="rightSpeed">0</span> mm/s</p>
                            <p>Encoder: <span id="rightEncoder">0</span> steps</p>
                            <div id="rightHealthBar" class="health-bar ok">✅</div>
                        </div>
                    </div>
                </section>

                <!-- Telemetry -->
                <section class="card">
                    <h2>Telemetry Log</h2>
                    <div id="telemetryLog" class="telemetry-log">
                        <p class="log-entry">Waiting for connection...</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
